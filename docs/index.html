<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asistan</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #161615; --panel: #1e1e1c; --ink: #e9e9e5; --muted: #8f8f89; --line: #2c2c29;
    --accent: #8b94dc; --user-bg: #262624;
    --soft: #232321;
    --ok: #7fb092;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: 'Urbanist', 'Segoe UI', sans-serif; font-weight: 400; background: var(--bg); color: var(--ink); line-height: 1.65; letter-spacing: .1px; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(97,107,176,.3); }
  a:hover { border-bottom-color: var(--accent); }
  button { font-family: inherit; font-weight: 400; }

  /* header */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 40; background: rgba(22,22,21,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .hbar { max-width: 920px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding: 13px 20px; }
  .wordmark { font-size: 15px; font-weight: 300; letter-spacing: .6px; color: var(--ink); border: 0; }
  .hspacer { flex: 1; }
  .hlink { background: none; border: 0; color: var(--muted); font-size: 12.5px; font-weight: 400; cursor: pointer; letter-spacing: .3px; padding: 0; }
  .hlink:hover { color: var(--ink); }
  .hsep { color: var(--line); font-weight: 200; }

  /* kabuk */
  .chatwrap { max-width: 780px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 56px 20px 28px; }

  /* açılış */
  .landing { text-align: center; padding: 24px 0 30px; }
  .landing h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -.3px; }
  .landing p { margin: 0; color: var(--muted); font-size: 15px; font-weight: 400; }

  /* girdi */
  .input-zone { margin-top: 26px; }
  .input-box { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 18px; transition: border-color .2s, box-shadow .2s; }
  .input-box:focus-within { border-color: #3d3d38; box-shadow: 0 2px 24px rgba(0,0,0,.28); }
  .input-box input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 15.5px; font-family: inherit; font-weight: 400; padding: 9px 0; }
  .input-box input::placeholder { color: #61615b; font-weight: 400; }
  .send { border: 0; background: var(--accent); color: #16161a; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 17px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; transition: filter .15s, transform .1s; }
  .send:hover { filter: brightness(1.12); }
  .send:active { transform: scale(.94); }
  .daily-note { text-align: center; margin-top: 12px; }
  .daily-note button { background: none; border: 0; color: var(--muted); font-size: 11.5px; font-weight: 300; letter-spacing: .4px; cursor: pointer; border-bottom: 1px dotted var(--line); padding-bottom: 1px; }
  .daily-note button:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* sohbet */
  .chat-area { display: none; flex-direction: column; min-height: 0; }
  .chat-log { overflow-y: auto; padding: 4px 2px 8px; scroll-behavior: smooth; max-height: calc(100vh - 230px); }
  .msg { max-width: 88%; font-size: 15px; font-weight: 400; margin-bottom: 18px; }
  .msg.bot { color: var(--ink); }
  .msg.bot b, .msg.bot strong { font-weight: 600; }
  .msg.bot .src { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .msg.me { margin-left: auto; background: var(--soft); border-radius: 14px 14px 4px 14px; padding: 10px 16px; color: #d6d6d0; }
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 6px 0; }
  .typing i { width: 5px; height: 5px; background: #55554f; border-radius: 50%; animation: tp 1.1s infinite; font-style: normal; }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes tp { 0%, 60%, 100% { transform: none; opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* kartlar */
  .cards { display: grid; gap: 10px; margin-top: 4px; }
  .ccard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .cc-title { font-size: 15px; font-weight: 400; }
  .cc-sub { font-size: 12px; color: var(--muted); font-weight: 300; }
  .cc-badge { float: right; font-size: 10.5px; font-weight: 400; color: var(--muted); letter-spacing: .4px; }
  .cc-price { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; }
  .cc-price .big { font-size: 19px; font-weight: 300; }
  .cc-price .small { font-size: 12px; color: var(--muted); }
  .months-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .mchip { font-size: 10.5px; font-weight: 400; color: var(--muted); }
  .mchip:not(:last-child)::after { content: '·'; margin-left: 5px; color: var(--line); }
  .cc-acts { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .cbtn { border: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 400; cursor: pointer; padding: 0; border-bottom: 1px solid rgba(97,107,176,.25); }
  .cbtn:hover { border-bottom-color: var(--accent); }
  .cbtn.muted { color: var(--muted); border-bottom-color: transparent; }
  .cbtn.muted:hover { color: var(--ink); }
  .cbtn.ok { color: var(--ok); border-bottom-color: rgba(106,156,126,.3); }

  /* panel */
  .sheet { position: fixed; inset: 0; z-index: 95; background: var(--bg); display: none; flex-direction: column; }
  .sheet.open { display: flex; }
  .sheet-head { display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--line); padding: 18px 22px 14px; }
  .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 200; letter-spacing: .3px; }
  .sheet-head .sh-sub { font-size: 11.5px; color: var(--muted); font-weight: 300; }
  .sheet-close { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 13px; cursor: pointer; }
  .sheet-close:hover { color: var(--ink); }
  .sheet-body { flex: 1; overflow-y: auto; padding: 20px; }
  .sheet-in { max-width: 1040px; margin: 0 auto; }

  .filters { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 4px; }
  .frow { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .frow + .frow { margin-top: 10px; }
  .fsearch { flex: 1; min-width: 170px; }
  .fsearch input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-family: inherit; font-size: 13px; font-weight: 300; color: var(--ink); padding: 5px 0; outline: 0; }
  .fsearch input:focus { border-bottom-color: var(--ink); }
  select.sel { border: 0; border-bottom: 1px solid var(--line); background: transparent; border-radius: 0; padding: 5px 2px; font-family: inherit; font-size: 12.5px; font-weight: 300; color: var(--muted); cursor: pointer; outline: 0; }
  .fchip { border: 0; border-bottom: 1px solid transparent; background: none; color: var(--muted); font-size: 12px; font-weight: 300; padding: 3px 0; cursor: pointer; }
  .fchip:hover { color: var(--ink); }
  .fchip.on { color: var(--ink); border-bottom-color: var(--ink); }
  .freset { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; }
  .fcount { font-size: 11.5px; color: var(--muted); font-weight: 300; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 18px; }
  .dcard { background: var(--panel); padding: 18px; display: flex; flex-direction: column; }
  .dc-title { font-size: 15px; font-weight: 400; }
  .dc-country { font-size: 11px; color: var(--muted); letter-spacing: .5px; }
  .dc-badge { float: right; font-size: 10.5px; color: var(--muted); }
  .dc-route { font-size: 12.5px; color: var(--muted); margin-top: 8px; font-weight: 300; }
  .dc-meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .dc-price { margin-top: 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .dc-price .val { font-size: 18px; font-weight: 300; }
  .dc-price .total4 { font-size: 11.5px; color: var(--muted); }
  .dc-actions { display: flex; gap: 14px; margin-top: 12px; }

  .appr-line { font-size: 12.5px; color: var(--muted); padding: 10px 2px 16px; display: flex; gap: 16px; flex-wrap: wrap; align-items: baseline; }
  .appr-line b { color: var(--ink); font-weight: 400; }
  .appr-line .lnk { color: var(--accent); cursor: pointer; background: none; border: 0; font-size: 12.5px; padding: 0; font-family: inherit; }
  .rez-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .rez-card { background: var(--panel); padding: 16px 18px; }
  .rez-card .rt { font-size: 14.5px; font-weight: 400; }
  .rez-card .rs { font-size: 11.5px; color: var(--muted); }
  .rez-badge { float: right; font-size: 10.5px; color: var(--muted); }
  .bar { height: 1px; background: var(--line); position: relative; margin: 12px 0 8px; }
  .bar > span { position: absolute; left: 0; top: 0; height: 1px; background: var(--accent); transition: width .3s; }
  .rez-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .rez-btn { margin-top: 10px; border: 0; background: none; color: var(--accent); font-size: 12.5px; cursor: pointer; padding: 0; font-family: inherit; border-bottom: 1px solid rgba(97,107,176,.25); }
  .rez-btn.done { color: var(--ok); border-bottom-color: rgba(106,156,126,.3); }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(14,14,13,.88); backdrop-filter: blur(6px); z-index: 100; display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(680px, 100%); overflow: hidden; }
  .m-head { display: flex; align-items: baseline; gap: 12px; padding: 20px 24px 6px; }
  .m-head h3 { margin: 0; font-size: 18px; font-weight: 200; }
  .m-head .ms { font-size: 11.5px; color: var(--muted); font-weight: 300; }
  .m-close { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 14px; cursor: pointer; }
  .m-close:hover { color: var(--ink); }
  .m-body { padding: 10px 24px 24px; }
  .m-tabs { display: flex; gap: 20px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .m-tab { border: 0; border-bottom: 1px solid transparent; background: none; font-weight: 300; font-size: 12.5px; padding: 6px 0; cursor: pointer; color: var(--muted); }
  .m-tab.on { color: var(--ink); border-bottom-color: var(--ink); }
  .m-pane { display: none; }
  .m-pane.on { display: block; }
  .day { display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; font-weight: 300; }
  .day:last-child { border-bottom: 0; }
  .day b { flex: 0 0 54px; color: var(--muted); font-weight: 400; font-size: 12px; }
  .steps { counter-reset: s; list-style: none; margin: 0; padding: 0; }
  .steps li { counter-increment: s; position: relative; padding: 9px 0 9px 34px; border-bottom: 1px solid var(--line); font-size: 13.5px; font-weight: 300; }
  .steps li:last-child { border-bottom: 0; }
  .steps li::before { content: counter(s) '.'; position: absolute; left: 0; top: 9px; color: var(--muted); font-size: 12px; font-weight: 400; }
  .m-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 14px; }
  .m-info .k { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .m-info .v { font-size: 14px; font-weight: 300; }
  .wiz-steps { display: flex; gap: 18px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .wiz-step { border: 0; border-bottom: 1px solid transparent; background: none; font-size: 12px; font-weight: 300; color: var(--muted); padding: 6px 0; cursor: pointer; }
  .wiz-step.on { color: var(--ink); border-bottom-color: var(--ink); }
  .wiz-step.past { color: var(--ok); }
  .link-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 14px 0; }
  .llink { background: var(--soft); border-radius: 10px; padding: 12px 14px; color: var(--ink); transition: .15s; border: 0; }
  .llink:hover { background: #2b2b28; }
  .llink .lk { font-size: 12.5px; font-weight: 400; display: block; }
  .llink .ld { font-size: 11px; color: var(--muted); font-weight: 300; }
  .opt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .opt { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 10px; padding: 13px 15px; font-size: 12.5px; font-weight: 300; cursor: pointer; text-align: left; font-family: inherit; }
  .opt small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .opt.on { border-color: var(--ink); }
  .note { background: var(--soft); border-radius: 10px; padding: 11px 14px; font-size: 12.5px; color: #9d9d96; margin-top: 12px; font-weight: 300; }
  .chk { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; font-weight: 300; cursor: pointer; }
  .chk:last-child { border-bottom: 0; }
  .chk input { margin-top: 5px; accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; flex: 0 0 auto; }
  .chk.done span { color: var(--muted); text-decoration: line-through; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .form-row input { border: 0; border-bottom: 1px solid var(--line); background: transparent; border-radius: 0; padding: 8px 2px; font-family: inherit; font-size: 13.5px; font-weight: 300; outline: 0; width: 100%; color: var(--ink); }
  .form-row input:focus { border-bottom-color: var(--ink); }
  .form-row .full { grid-column: 1/-1; }
  .wiz-actions { display: flex; gap: 20px; margin-top: 18px; }
  .wbtn { border: 0; background: none; font-size: 12.5px; font-weight: 400; cursor: pointer; padding: 0 0 2px; color: var(--accent); font-family: inherit; border-bottom: 1px solid rgba(97,107,176,.3); }
  .wbtn.plain { color: var(--muted); border-bottom-color: transparent; }
  .wbtn.ok { color: var(--ok); border-bottom-color: rgba(106,156,126,.3); }
  .sum-box { background: var(--soft); border-radius: 10px; padding: 14px; font-size: 12px; white-space: pre-wrap; font-weight: 300; max-height: 200px; overflow-y: auto; margin-top: 14px; color: #9d9d96; user-select: all; line-height: 1.8; }

  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(70px); background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 300; letter-spacing: .3px; padding: 10px 20px; border-radius: 999px; z-index: 130; opacity: 0; transition: .25s; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .m-info, .opt-row { grid-template-columns: 1fr; gap: 10px; }
    .form-row { grid-template-columns: 1fr; }
    .landing h1 { font-size: 22px; }
    .msg { max-width: 96%; }
  }
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="wordmark">asistan</div>
    <div class="hspacer"></div>
    <button class="hlink" onclick="openSheet('destSheet')">Rotalar</button>
    <span class="hsep">·</span>
    <button class="hlink" onclick="openSheet('rezSheet')">Rezervasyonlar</button>
    <span class="hsep">·</span>
    <button class="hlink" id="pillCount" onclick="openSheet('rezSheet')">0 onaylı</button>
    <span class="hsep">·</span>
    <button class="hlink" onclick="askNotify()">bildirim</button>
  </div>
</header>

<main class="chatwrap" id="chatwrap">

  <div class="landing" id="landing">
    <h1>Merhaba Ömer.</h1>
    <p>Size nasıl yardımcı olabilirim?</p>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="chat-log" id="chatLog"></div>
  </div>

  <div class="input-zone">
    <form class="input-box" id="chatForm" autocomplete="off">
      <input id="chatInput" type="text" placeholder="Bir şey sorun..." />
      <button class="send" type="submit" title="Gönder">↑</button>
    </form>
    <div class="daily-note" id="dailyNote">
      <button onclick="askDaily()">bugün için bir önerim var</button>
    </div>
  </div>

</main>

<!-- ROTALAR -->
<div class="sheet" id="destSheet">
  <div class="sheet-head">
    <div><h2>Rotalar</h2><div class="sh-sub">Ankara (ESB) kalkışlı · 3 yetişkin + 1 çocuk (15) · fiyatlar tahmini</div></div>
    <button class="sheet-close" onclick="closeSheet('destSheet')">kapat</button>
  </div>
  <div class="sheet-body"><div class="sheet-in">
    <div class="filters">
      <div class="frow">
        <div class="fsearch"><input id="q" type="text" placeholder="ülke veya şehir ara" /></div>
        <select class="sel" id="fVisa">
          <option value="">vize durumu</option>
          <option value="vizesiz">vizesiz</option>
          <option value="kimlik">kimlikle giriş</option>
          <option value="kapi">kapı vizesi</option>
          <option value="schengen">schengen / vize gerekli</option>
        </select>
        <select class="sel" id="fMonth"><option value="">ay</option></select>
        <select class="sel" id="fBudget">
          <option value="">bütçe (4 kişi)</option>
          <option value="low">20.000 ₺ altı</option>
          <option value="mid">20.000-50.000 ₺</option>
          <option value="high">50.000 ₺ üzeri</option>
        </select>
        <select class="sel" id="fSort">
          <option value="rec">öneri sırası</option>
          <option value="priceAsc">fiyat (artan)</option>
          <option value="durAsc">uçuş süresi (artan)</option>
          <option value="freqAsc">uçuş sıklığı (artan)</option>
        </select>
        <button class="freset" onclick="resetFilters()">sıfırla</button>
      </div>
      <div class="frow" id="regionChips">
        <button class="fchip on" data-r="">tümü</button>
        <button class="fchip" data-r="balkan">balkanlar</button>
        <button class="fchip" data-r="kafkasya">kafkasya</button>
        <button class="fchip" data-r="korfez">körfez</button>
        <button class="fchip" data-r="ortaasya">orta asya</button>
        <button class="fchip" data-r="akdeniz">akdeniz &amp; orta doğu</button>
        <button class="fchip" data-r="avrupa">avrupa</button>
        <button class="fchip" data-r="uzak">uzak coğrafya</button>
        <span class="fcount" id="cCount">0 rota</span>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div></div>
</div>

<!-- REZERVASYONLAR -->
<div class="sheet" id="rezSheet">
  <div class="sheet-head">
    <div><h2>Rezervasyonlar</h2><div class="sh-sub">onaylanan rotalar ve adım adım sihirbaz</div></div>
    <button class="sheet-close" onclick="closeSheet('rezSheet')">kapat</button>
  </div>
  <div class="sheet-body"><div class="sheet-in">
    <div class="appr-line">
      <span><b id="apprCount">0</b> program onaylı</span>
      <span><b id="apprDone">0</b> rezervasyon tamam</span>
      <span>topplam <b id="apprTotal">0 ₺</b></span>
      <button class="lnk" onclick="approveAll()">tümünü onayla</button>
      <button class="lnk" onclick="clearAll()">tümünü geri al</button>
    </div>
    <div class="rez-grid" id="rezGrid"></div>
  </div></div>
</div>

<!-- PROGRAM -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="m-head">
      <h3 id="mTitle">—</h3>
      <div class="ms" id="mSub">—</div>
      <button class="m-close" onclick="closeModal()">kapat</button>
    </div>
    <div class="m-body">
      <div class="m-tabs">
        <button class="m-tab on" data-pane="p1" onclick="switchTab(this)">gezi programı</button>
        <button class="m-tab" data-pane="p2" onclick="switchTab(this)">rezervasyon adımları</button>
      </div>
      <div class="m-pane on" id="pane-p1"></div>
      <div class="m-pane" id="pane-p2"></div>
    </div>
  </div>
</div>

<!-- SİHİRBAZ -->
<div class="overlay" id="wizOverlay" onclick="if(event.target===this)closeWizard()">
  <div class="modal">
    <div class="m-head">
      <h3 id="wTitle">—</h3>
      <div class="ms" id="wSub">—</div>
      <button class="m-close" onclick="closeWizard()">kapat</button>
    </div>
    <div class="m-body">
      <div class="wiz-steps">
        <button class="wiz-step on" onclick="wizNav(1)">1 · uçuş ara</button>
        <button class="wiz-step" onclick="wizNav(2)">2 · tarih &amp; otel</button>
        <button class="wiz-step" onclick="wizNav(3)">3 · kontrol</button>

function bookingLink(d) { return 'https://www.booking.com/searchresults.tr.html?ss=' + encodeURIComponent(baseCity(d)) + '&group_adults=3&group_children=1&age=15&no_rooms=2&lang=tr&selected_currency=TRY'; }
function airlineLinks(d) {
  const l = [];
  if (/AJet/.test(d.airline)) l.push(['AJet', 'ajet.com — ESB çıkışlı', 'https://www.ajet.com']);
  if (/Pegasus/.test(d.airline)) l.push(['Pegasus', 'flypgs.com', 'https://www.flypgs.com']);
  if (/THY/.test(d.airline)) l.push(['THY', 'turkishairlines.com', 'https://www.turkishairlines.com']);
  if (/Royal/.test(d.airline)) l.push(['Royal Jordanian', 'rj.com', 'https://www.rj.com']);
  if (/Feribot/.test(d.airline)) l.push(['Feribot', 'Çeşme hattı — saatler', skyLink(d)]);
  return l;
}
function saveGunluk() { try { localStorage.setItem(GUN_KEY, JSON.stringify(gunluk)); } catch (e) {} }
function loadGunluk() {
  let g = null;
  try { g = JSON.parse(localStorage.getItem(GUN_KEY)); } catch (e) {}
  const today = todayStr();
  if (!g || g.date !== today) {
    gunluk = { date: today, streak: (g && g.date === yesterdayStr()) ? (g.streak || 0) + 1 : 1 };
    saveGunluk();
    if (gunluk.streak > 1) notifyDaily();
  } else gunluk = g;
}
function notifyDaily() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification('Asistan', { body: 'Bugün için bir öneriniz var.' }); } catch (e) {}
}
function askNotify() {
  if (!('Notification' in window)) { toast('Tarayıcın bildirimleri desteklemiyor'); return; }
  Notification.requestPermission().then((p) => {
    if (p === 'granted') { toast('Günlük bildirim açıldı'); try { new Notification('Asistan', { body: 'Hazırım — gün içinde bir öneriniz olursa haber vereceğim.' }); } catch (e) {} }
    else toast('Bildirim izni verilmedi');
  }).catch(() => toast('Bildirim izni verilemedi'));
}
function nextSeasonDest(list) {
  if (!list.length) return { d: D[0], m: 1, gap: 0 };
  const m = new Date().getMonth() + 1;
  let best = null, bestGap = 99, bestM = 1;
  list.forEach((d) => d.months.forEach((mm) => {
    const gap = (mm - m + 12) % 12;
    if (gap < bestGap) { bestGap = gap; best = d; bestM = mm; }
  }));
  return { d: best || D[0], m: bestM, gap: bestGap };
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

  if (approved.has(id)) { approved.delete(id); toast(baseCity(d) + ' onayı geri alındı'); }
  else { approved.add(id); toast(baseCity(d) + ' onaylandı'); }
  refreshAll();
}
function approveAll() { D.forEach((d) => approved.add(d.id)); refreshAll(); toast('Tüm programlar onaylandı'); }
function clearAll() { approved.clear(); refreshAll(); toast('Tüm onaylar geri alındı'); }
function refreshAll() { saveState(); renderGrid(); renderRezCenter(); renderApprovalHeader(); }

function getFiltered() {
  let list = D.filter((d) => {
    if (filters.q) {
      const hay = normalize(d.city + ' ' + d.country + ' ' + d.tags.join(' '));
      if (!hay.includes(filters.q)) return false;
    }
    if (filters.visa && d.visa !== filters.visa) return false;
    if (filters.month && !d.months.includes(Number(filters.month))) return false;
    if (filters.region && d.region !== filters.region) return false;
    if (filters.budget) {
      const t4 = d.price * 4;
      if (filters.budget === 'low' && t4 >= 20000) return false;
      if (filters.budget === 'mid' && (t4 < 20000 || t4 > 50000)) return false;
      if (filters.budget === 'high' && t4 <= 50000) return false;
    }
    return true;
  });
  if (filters.sort === 'priceAsc') list.sort((a, b) => a.price - b.price);
  else if (filters.sort === 'durAsc') list.sort((a, b) => a.durMin - b.durMin);
  else if (filters.sort === 'freqAsc') list.sort((a, b) => (b.freq || 0) - (a.freq || 0));
  else list.sort((a, b) => a.pop - b.pop);
  return list;
}
function renderGrid() {
  const list = getFiltered();
  const cc = document.getElementById('cCount');
  if (cc) cc.textContent = list.length + ' rota';
  const grid = document.getElementById('grid');
  if (!grid) return;
  if (!list.length) { grid.innerHTML = '<div class="dcard">Kritere uyan rota bulunamadı — filtreleri sıfırlayın.</div>'; return; }
  grid.innerHTML = list.map((d) => `
    <div class="dcard">
      <div class="dc-badge">${d.visaTxt}</div>
      <div class="dc-title">${d.city}</div>

      <div class="dc-route">ESB — ${d.code} · ${d.dur}</div>
      <div class="dc-meta">${d.airline}${d.freq ? ' · ' + d.freq + ' uçuş/ay' : ''} · ${d.months.slice(0, 6).map(monthName).join(', ')}</div>
      <div class="dc-price">
        <div class="val">${fmt(d.price)} <span style="font-size:11px;color:var(--muted)">kişi başı gidiş-dönüş</span></div>
        <div class="total4">4 kişi ${fmt(d.price * 4)}</div>
      </div>
      <div class="dc-actions">
        <button class="cbtn" onclick="openModal('${d.id}')">program</button>
        ${approved.has(d.id)

          : `<button class="cbtn muted" onclick="toggle('${d.id}')">onayla</button>`}
      </div>
    </div>`).join('');
}
function renderApprovalHeader() {

function toggleChk(id, i) { const r = rezOf(id); r.chk[i] = !r.chk[i]; saveRez(); renderWizard(); renderRezCenter(); renderApprovalHeader(); }
function saveField(k, v) { if (!wizId) return; const r = rezOf(wizId); r[k] = v; saveRez(); }
function finishRez(id) {
  const r = rezOf(id);
  const d = D.find((x) => x.id === id);
  const pnrEl = document.getElementById('wPnr');
  if (pnrEl) { r.pnr = pnrEl.value.trim(); r.paid = document.getElementById('wPaid').value.trim(); r.fdate = document.getElementById('wDate').value; }
  if (!r.pnr) { toast('Önce PNR kodunu gir — ödeme yapılmadıysa kaydetme'); return; }
  r.done = true; r.doneAt = new Date().toLocaleDateString('tr-TR');
  saveRez();
  renderRezCenter(); renderApprovalHeader();
  renderWizard();
  toast('Rezervasyon tamamlandı: ' + baseCity(d));
  botSay('<b>' + baseCity(d) + '</b> rezervasyonu tamam. PNR: <b>' + esc(r.pnr) + '</b>. ' + (r.skipHotel ? 'Otelini gittiğinde bakarsın — istersen otel önerileri de sorarım.' : 'Uçuş tarihi yaklaştıkça check-in için yaz, hatırlatayım.'));
}
function summaryText(d) {
  const r = rezOf(d.id);
  return [
    d.city + ' (' + d.country + ') — ESB — ' + d.code,
    '4 kişi (3 yetişkin + 1 çocuk/15) · ' + d.airline + ' · uçuş ' + d.dur,
    d.visaTxt,
    'Tahmini uçak: ' + fmt(d.price * 4) + ' (kişi başı ' + fmt(d.price) + ', gidiş-dönüş)',
    'Uygun aylar: ' + d.months.slice(0, 6).map(monthName).join(', '),
    'Otel: ' + (r.skipHotel ? 'sen bakacaksın (atlandı)' : bookingLink(d)),
    'Rezervasyon: ' + (r.done ? ('tamam · PNR ' + (r.pnr || '-') + (r.paid ? ' · ' + r.paid : '') + ' · ' + (r.doneAt || '')) : ('yapılıyor — ' + chkCount(d.id) + '/' + CHECKLIST.length + ' adım')),
    'Program onaylı: ' + (approved.has(d.id) ? 'evet' : 'hayır'),
    'Bilet: ' + flightsLink(d),
    '— Asistan planı'
  ].join('\n');
}
function copySummary(id) {
  const d = D.find((x) => x.id === id);
  const txt = summaryText(d);
  let ok = false;
  try {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => toast('Kopyalandı')).catch(() => toast('Kopyalanamadı — aşağıdaki metni elle seç'));
    return;
  }

/* ================= CANLI YETENEKLER ================= */
function calc(expr) {
  const s = expr.replace(/\s+/g, '').replace(/,/g, '.');
  let i = 0;
  function parseExpr() {
    let v = parseTerm();
    while (s[i] === '+' || s[i] === '-') { const op = s[i++]; const r = parseTerm(); v = op === '+' ? v + r : v - r; }
    return v;
  }
  function parseTerm() {
    let v = parseFactor();
    while (s[i] === '*' || s[i] === '/' || s[i] === '%') { const op = s[i++]; const r = parseFactor(); v = op === '*' ? v * r : op === '/' ? v / r : v % r; }
    return v;
  }
  function parseFactor() {
    if (s[i] === '(') { i++; const v = parseExpr(); if (s[i] === ')') i++; return v; }
    if (s[i] === '-') { i++; return -parseFactor(); }
    if (s[i] === '+') { i++; return parseFactor(); }
    const m = /^\d+\.?\d*/.exec(s.slice(i));
    if (!m) throw new Error('parse');
    i += m[0].length;
    return parseFloat(m[0]);
  }
  const v = parseExpr();
  if (i !== s.length || !isFinite(v)) throw new Error('parse');
  return v;
}

function findDests(text) {
  const t = normalize(text);
  const words = t.split(' ').filter((w) => w.length >= 3);
  const scored = [];
  D.forEach((d) => {
    let s = 0;
    const names = (ALIAS[d.id] || []).concat([normalize(d.city), normalize(d.country)]);
    names.forEach((a) => { if (a && t.includes(a)) s += 5; });
    const hay = normalize(d.tags.join(' ') + ' ' + REGION_LABEL[d.region] + ' ' + d.visaTxt + ' ' + d.airline);
    words.forEach((w) => { if (hay.includes(w)) s += 1; if (d.tags.some((tag) => normalize(tag).includes(w))) s += 2; });
    if (s > 0) scored.push({ d: d, s: s });
  });
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, 3).map((x) => x.d);
}
function detectMonth(t) {
  for (const name in MONTH_NAMES) {
    if (t.includes(name)) return MONTH_NAMES[name];
    if (name === 'subat' && t.includes('şub')) return 2;
    if (name === 'haziran' && t.includes('haz')) return 6;
    if (name === 'temmuz' && t.includes('tem')) return 7;
    if (name === 'agustos' && (t.includes('ağus') || t.includes('ağu'))) return 8;
    if (name === 'eylul' && t.includes('eyl')) return 9;
  }
  const short = { 'oca':1, 'mar':3, 'nis':4, 'may':5, 'eki':10, 'kas':11, 'ara':12 };
  for (const s in short) { if (t.includes(' ' + s + ' ') || t.endsWith(' ' + s)) return short[s]; }
  return 0;
}

function visaParts(t) {

function seasonParts(t) {
  let ids = [];
  for (const k in SEASON_MAP) { if (t.includes(k)) ids = ids.concat(SEASON_MAP[k]); }
  ids = [...new Set(ids)];
  const list = ids.map((id) => D.find((x) => x.id === id)).filter(Boolean).sort((a, b) => a.price - b.price);

function statusParts() {

  const pending = list.filter((d) => !isDone(d.id));
  if (!list.length) return ['Henüz onaylı rotan yok. Bir rota seçince "onayla" demen yeterli — gerisini ben hallederim.'];
  return [

    '4 kişi toplam (uçak, tahmini): <b>' + fmt(list.reduce((s, d) => s + d.price * 4, 0)) + '</b>'

function fallbackParts() {

function respond(text) {
  const t = normalize(text);
  const dests = findDests(text);

  if (/teşekkür|tesekkür|sağol|sagol|eyvallah|eyvallah/.test(t)) { botSeq(['Rica ederim. Başka bir şey lazımsa buradayım.']); return; }
  if (/kimsin|sen kim|nesin|kendini tanıt/.test(t)) { botSeq(['Ben <b>asistan</b> — bu sayfada çalışan kişisel yardımcın. Seyahat planlama, rezervasyon, bilgi arama, hava durumu, hesap ve zaman sorularında yardımcı olurum. Yazman yeterli.']); return; }
  if (/nasılsın|naber|ne haber/.test(t)) { botSeq(['İyiyim, hazırım. Sen ne yapmak istersin — bir rota mı bakalım, yoksa başka bir soru mu var?']); return; }
  if (/saat kaç|saat ne|hangi gün|bugün günlerden|tarih (ne|kaç)|hangi aydayız|yıl kaç/.test(t)) {
    const now = new Date();
    botSeq(['Şu an <b>' + now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) + '</b>, ' + now.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '.']);
    return;
  }
  if (t.includes('hava') && (t.includes('durum') || t.includes('nasıl') || t.includes('kaç') || t.includes('sıcak') || t.includes('yağmur') || t.includes('yagmur'))) {
    const city = dests.length ? baseCity(dests[0]) : (t.split(' ').filter((w) => w.length >= 3 && !['hava', 'durum', 'nasıl', 'bugün', 'sıcak', 'yağmur'].includes(w))[0] || 'Ankara');
    askWeather(city.charAt(0).toLocaleUpperCase('tr') + city.slice(1));
    return;
  }
  const cleaned = text.replace(/[^0-9+\-*/().,%\s]/g, '');
  if (/[+\-*/]/.test(cleaned) && /\d/.test(cleaned) && /^[\d\s+\-*/().,%]+$/.test(cleaned)) {
    try {
      const v = calc(cleaned);
      botSeq(['<b>' + cleaned.trim() + ' = ' + (Math.round(v * 1e10) / 1e10).toLocaleString('tr-TR') + '</b>']);
      return;
    } catch (e) { /* wiki'ye düş */ }
  }
  if (t.includes('yardım') || t.includes('yardim') || t.includes('ne yapabilirsin') || t.includes('neler yapabilirsin')) { botSeq(helpParts()); return; }
  if (t.includes('rezervasyon') || t.includes('bilet') || t.includes('uçuş') || t.includes('ucus') || t.includes('uçak') || t.includes('ayırt') || t.includes('ayrıt')) { botSeq(resvParts(dests)); return; }
  const m = detectMonth(t);
  if (m) { botSeq(monthParts(m)); return; }
  if (t.includes('vize') || t.includes('kimlik') || t.includes('pasaport')) { botSeq(visaParts(t)); return; }
  if (['deniz', 'plaj', 'kayak', 'dağ', 'doga', 'doğa', 'kültür', 'kultur', 'aile', 'çocuk', 'cöl', 'çöl', 'bahar', 'kış', 'uzak', 'ada'].some((k) => t.includes(k))) { botSeq(seasonParts(t)); return; }
  if (t.includes('ucuz') || t.includes('ekonomik') || t.includes('hesaplı') || t.includes('bütçe') || t.includes('butce') || t.includes('fiyat') || t.includes('kaça') || t.includes('ne kadar')) { botSeq(cheapParts(dests)); return; }
  if (t.includes('öner') || t.includes('oner') || t.includes('nereye') || t.includes('neresi') || t.includes('tavsiye') || t.includes('karar ver')) { botSeq(suggestParts()); return; }
  if (t.includes('onay') || t.includes('durum') || t.includes('liste') || t.includes('özet') || t.includes('ozet') || t.includes('toplam')) { botSeq(statusParts()); return; }
  if (dests.length) { botSeq(programParts(dests[0])); return; }
  botSeq(fallbackParts());
  askWiki(text);
}

  document.getElementById('fMonth').addEventListener('change', (e) => { filters.month = e.target.value; renderGrid(); });
  document.getElementById('fBudget').addEventListener('change', (e) => { filters.budget = e.target.value; renderGrid(); });
  document.getElementById('fSort').addEventListener('change', (e) => { filters.sort = e.target.value; renderGrid(); });
  document.querySelectorAll('#regionChips .fchip').forEach((chip) => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#regionChips .fchip').forEach((c) => c.classList.remove('on'));
      chip.classList.add('on');
      filters.region = chip.dataset.r;
      renderGrid();
    });
  });
  document.getElementById('chatForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = document.getElementById('chatInput').value.trim();
    if (!v) return;
    document.getElementById('chatInput').value = '';
    startChat();
    userSay(v);
    respond(v);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeModal(); closeWizard(); document.querySelectorAll('.sheet.open').forEach((s) => closeSheet(s.id)); }
  });

  renderGrid(); renderRezCenter(); renderApprovalHeader();
})();
</script>
</body>
</html>
